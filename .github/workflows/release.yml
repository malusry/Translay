name: Release

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: translay-release
  cancel-in-progress: false

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 45

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: npm

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"

      - name: Install dependencies
        run: npm ci

      - name: Run checks
        run: npm run check

      - name: Build release
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: v0.5.0
          releaseName: "Translay v0.5.0"
          releaseBody: |
            Translay v0.5.0 Windows 正式版。

            本次更新：
            - 改进翻译浮层阅读、数学公式显示、详细解释、失败重试与连续选区请求隔离
            - 日常模式支持简短语气附注；成功译文使用有容量和时限的内存缓存
            - 新托盘菜单、单击切换划词图标、双击切换日常／学习模式及轻量反馈
            - 每次重新启动默认开启划词图标；本次运行仍可关闭
            - 统一配置和托盘字体，优化保存按钮、连接测试及完整失败原因显示
            - 修复重复测试、编辑中旧结果、乱序返回及后端／提供商健康状态归属
            - 改进配置窗口隐藏／重开及旧会话操作隔离

            主要功能：
            - 选中文字后显示轻量翻译按钮，点击即可翻译
            - 保留 Ctrl+Shift+T 全局快捷键翻译方式
            - 改进 UI Automation、剪贴板回退与翻译请求协调
            - 使用折叠丝带桌面图标与带开启／关闭状态的托盘图标
            - 支持本地 OpenAI-compatible 服务与远程 API
            - 支持日常、学习模式和模型思考开关
            - API Key 仅保存在 Windows 凭据管理器

            下载 `setup.exe` 完成当前用户安装。本版本尚未进行商业代码签名，
            Windows 可能显示来源未知提示，请只从本仓库下载。
          releaseDraft: true
          prerelease: false
          args: "--bundles nsis"
