[package]
name = "translay-core"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "Shared configuration and model transport for Translay desktop apps"

[dependencies]
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
tokio = { version = "1", features = ["rt", "net", "time"] }
