  <text x="1134" y="943" fill="#353943" font-family="Segoe UI, sans-serif" font-size="21" font-weight="700">Translay</text>
  <text x="1134" y="968" fill="#858A93" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="14">选中文字，即刻理解</text>
