    <path d="M10 19c0-5 4-9 9-9h32c5 0 9 4 9 9v19c0 5-4 9-9 9H39L30 55v-8H19c-5 0-9-4-9-9z" fill="#FAF9F5"/>
    <rect x="19" y="22" width="27" height="5" rx="2.5" fill="#5967AE"/>
    <rect x="19" y="32" width="19" height="5" rx="2.5" fill="#858CAF"/>
  </g>
  <text x="214" y="940" fill="#4E5460" font-family="Segoe UI, sans-serif" font-size="17">64 px</text>
  <text x="214" y="968" fill="#858A93" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="15">设置页 / 快捷方式</text>

