  <text x="80" y="134" fill="#767B85" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="19" letter-spacing=".4">围绕“选中文字 → 译文以轻盈浮层出现”设计的三种几何方向</text>

  <!-- Card A -->
  <g filter="url(#cardShadow)">
    <rect x="80" y="184" width="448" height="600" rx="34" fill="#FCFCFA"/>
  </g>
  <rect x="112" y="216" width="100" height="34" rx="17" fill="#ECEEF8"/>
  <text x="162" y="239" text-anchor="middle" fill="#5967AE" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="15" font-weight="700" letter-spacing="1">推荐方向</text>
  <g transform="translate(164 274)">
    <rect width="280" height="280" rx="62" fill="url(#iconBg)"/>
    <g filter="url(#glyphShadow)">
