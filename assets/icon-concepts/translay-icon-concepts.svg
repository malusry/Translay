  <text x="1104" y="644" fill="#666B75" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="18">让字母 T 像纸带一样翻折变色</text>
  <text x="1104" y="675" fill="#666B75" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="18">结构最简洁，适合建立品牌记忆</text>
  <line x1="1104" y1="712" x2="1488" y2="712" stroke="#E8E6E1"/>
  <circle cx="1118" cy="747" r="5" fill="#5967AE"/>
