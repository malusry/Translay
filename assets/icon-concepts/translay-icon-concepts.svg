<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1080">
  <defs>
    <linearGradient id="pageBg" x1="0" y1="0" x2="1600" y2="1080" gradientUnits="userSpaceOnUse">
      <stop stop-color="#F8F7F3"/>
      <stop offset="1" stop-color="#EFEEE9"/>
    </linearGradient>
    <linearGradient id="iconBg" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#6D79BA"/>
      <stop offset="1" stop-color="#4B5798"/>
    </linearGradient>
    <linearGradient id="iconBgWarm" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#747EB6"/>
      <stop offset="1" stop-color="#515B91"/>
    </linearGradient>
    <filter id="cardShadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="12" stdDeviation="24" flood-color="#4D5265" flood-opacity=".12"/>
    </filter>
    <filter id="glyphShadow" x="-25%" y="-25%" width="150%" height="160%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#30386D" flood-opacity=".26"/>
    </filter>
  </defs>

  <rect width="1600" height="1080" fill="url(#pageBg)"/>
