      <path d="M39 63c0-16 13-29 29-29h113c16 0 29 13 29 29v69c0 16-13 29-29 29h-42l-30 28c-6 5-14 2-14-6v-22H68c-16 0-29-13-29-29V63z" fill="#FAF9F5"/>
