  <text x="112" y="604" fill="#272A31" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="27" font-weight="700">01  浮译层</text>
  <text x="112" y="644" fill="#666B75" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="18">原文卡片与译文卡片错位叠放</text>
  <text x="112" y="675" fill="#666B75" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="18">直接对应 Translay 的浮层体验</text>
  <line x1="112" y1="712" x2="496" y2="712" stroke="#E8E6E1"/>
  <circle cx="126" cy="747" r="5" fill="#75D7BD"/>
