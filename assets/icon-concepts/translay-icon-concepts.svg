    <rect width="48" height="48" rx="11" fill="url(#iconBg)"/>
    <path d="M19 20c0-3 2-5 5-5h14c3 0 5 2 5 5v11c0 3-2 5-5 5h-5l-4 4v-4h-5c-3 0-5-2-5-5z" fill="#75D7BD"/>
    <path d="M6 11c0-3 2-5 5-5h19c3 0 5 2 5 5v11c0 3-2 5-5 5h-7l-6 5v-5h-6c-3 0-5-2-5-5z" fill="#FAF9F5"/>
    <rect x="11" y="13" width="16" height="3" rx="1.5" fill="#5967AE"/>
    <rect x="11" y="19" width="11" height="3" rx="1.5" fill="#858CAF"/>
  </g>
  <text x="492" y="950" fill="#4E5460" font-family="Segoe UI, sans-serif" font-size="17">32 px</text>
  <text x="492" y="976" fill="#858A93" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="15">高 DPI 托盘</text>

  <rect x="685" y="902" width="294" height="82" rx="18" fill="#2D3037"/>
  <circle cx="716" cy="943" r="3" fill="#8F949E"/>
  <path d="M748 950h13l6-8 6 8h14" fill="none" stroke="#B9BEC8" stroke-width="3" stroke-linecap="round"/>
  <g transform="translate(819 931)">
    <rect width="24" height="24" rx="5.5" fill="#5967AE"/>
    <path d="M9 9c0-1.5 1.2-2.7 2.7-2.7h7c1.5 0 2.7 1.2 2.7 2.7v5.4c0 1.5-1.2 2.7-2.7 2.7h-2.3l-2 2v-2h-2.7C10.2 17.1 9 15.9 9 14.4z" fill="#75D7BD"/>
    <path d="M2.8 5.5c0-1.5 1.2-2.7 2.7-2.7h8.3c1.5 0 2.7 1.2 2.7 2.7v5.2c0 1.5-1.2 2.7-2.7 2.7h-3.3l-3 2.5v-2.5h-2c-1.5 0-2.7-1.2-2.7-2.7z" fill="#FAF9F5"/>
  </g>
  <text x="862" y="950" fill="#D7D9DE" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="16">20 px 托盘实景</text>

  <rect x="1040" y="902" width="438" height="82" rx="18" fill="#EFEEE9"/>
  <g transform="translate(1062 917)">
    <rect width="52" height="52" rx="13" fill="url(#iconBg)"/>
    <path d="M20 21c0-3 2-5 5-5h16c3 0 5 2 5 5v12c0 3-2 5-5 5h-5l-5 4v-4h-6c-3 0-5-2-5-5z" fill="#75D7BD"/>
    <path d="M7 12c0-3 2-5 5-5h21c3 0 5 2 5 5v13c0 3-2 5-5 5h-8l-6 5v-5h-7c-3 0-5-2-5-5z" fill="#FAF9F5"/>
    <rect x="13" y="15" width="17" height="3.5" rx="1.75" fill="#5967AE"/>
    <rect x="13" y="22" width="12" height="3.5" rx="1.75" fill="#858CAF"/>
