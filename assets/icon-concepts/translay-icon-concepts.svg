  <text x="608" y="644" fill="#666B75" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="18">选区边角包裹文字与转换折线</text>
  <text x="608" y="675" fill="#666B75" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="18">一眼传达“选中后立即处理”</text>
