  <g filter="url(#cardShadow)">
    <rect x="80" y="832" width="1440" height="184" rx="34" fill="#FCFCFA"/>
  </g>
  <text x="116" y="880" fill="#272A31" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="22" font-weight="700">推荐稿的小尺寸与使用场景</text>

