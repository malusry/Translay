  <text x="80" y="132" fill="#777D88" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="19">让“选区 → 转换 → 浮层译文”的产品动作自然组成 T，而不是把字母 T 直接放进图标</text>
